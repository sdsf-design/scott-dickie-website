<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IceBreaker | Flip a card. Start a conversation.</title>
<meta name="description" content="IceBreaker: question cards that get everyone talking. For ages 5+.">
<style>
  :root{
    --pink:#ff90e8;
    --yellow:#ffd23f;
    --green:#7ed957;
    --blue:#8fd3ff;
    --ink:#0a0a0a;
    --paper:#f4ede1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Helvetica Neue", Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  a{color:inherit;}

  /* ---------- top bar: logo left, log in right ---------- */
  .bar{
    max-width:1040px; margin:0 auto; padding:16px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .logo{
    display:inline-flex; align-items:center; gap:.3em;
    font-size:clamp(20px, 3.8vw, 28px); font-weight:900; letter-spacing:-.5px; line-height:1;
    text-decoration:none; white-space:nowrap;
  }
  .logo svg{height:1.55em; width:auto; overflow:visible;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:3px solid var(--ink); border-radius:14px; background:#fff;
    color:var(--ink); box-shadow:5px 5px 0 var(--ink);
    font:inherit; font-weight:900; line-height:1; text-decoration:none;
    padding:12px 20px; font-size:17px; cursor:pointer;
    transition:transform .08s, box-shadow .08s;
  }
  .btn:hover{transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--ink);}
  .btn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}
  .btn:focus-visible{outline:3px solid var(--blue); outline-offset:3px;}
  .btn-big{background:var(--yellow); font-size:clamp(20px, 3vw, 24px); padding:18px 34px;}

  /* ---------- hero ---------- */
  main{max-width:1040px; margin:0 auto; padding:8px 16px 56px; text-align:center; overflow-x:clip;}
  .hero-logo{
    display:inline-flex; align-items:center; gap:.3em; margin:12px 0 0;
    font-size:clamp(34px, 9vw, 96px); font-weight:900; letter-spacing:-.02em; line-height:1;
  }
  .hero-logo svg{height:1.4em; width:auto; overflow:visible;}
  .tag{margin:16px auto 0; font-size:clamp(19px, 3.6vw, 28px); font-weight:800; color:#444; text-wrap:balance;}
  .ages{
    display:inline-block; margin-top:12px; padding:4px 12px;
    border:2.5px solid var(--ink); border-radius:999px; background:var(--green);
    font-size:14px; font-weight:900; box-shadow:3px 3px 0 var(--ink);
  }

  .video{
    position:relative; margin:36px auto 0; max-width:900px;
    border:3px solid var(--ink); border-radius:20px; overflow:hidden;
    background:var(--ink); box-shadow:10px 10px 0 var(--ink);
  }
  .video video{display:block; width:100%; height:auto; aspect-ratio:16/9; background:var(--ink);}
  /* little cards peeking out behind the video */
  .video-wrap{position:relative; max-width:900px; margin:0 auto;}
  .peek{
    position:absolute; width:clamp(60px, 11vw, 110px); aspect-ratio:3/4;
    border:3px solid var(--ink); border-radius:12px; z-index:-1;
  }
  .peek.p1{background:var(--pink); top:6px; left:-34px; transform:rotate(-14deg);}
  .peek.p2{background:var(--blue); bottom:-26px; right:-28px; transform:rotate(12deg);}
  .video-wrap{isolation:isolate;}

  .cta{margin:56px 0 0; display:flex; flex-direction:column; align-items:center; gap:16px;}
  .cta p{margin:0; font-size:16px; font-weight:700; color:#555;}
  .cta p a{font-weight:900;}
  .play-link{font-size:15px; font-weight:800; color:#555;}

  footer{padding:24px 16px 32px; text-align:center; font-size:13px; font-weight:700; color:#777;}

  .btn-try{background:var(--pink);}
  .hero-actions{margin-top:28px; display:flex; justify-content:center; flex-wrap:wrap; gap:16px;}
  .cta-row{display:flex; justify-content:center; flex-wrap:wrap; gap:16px;}

  /* ---------- Try it free: a sample card in a dialog, the same flip card as the game ---------- */
  .demo{
    width:min(480px, calc(100vw - 32px)); max-height:calc(100dvh - 32px); overflow:auto;
    margin:auto; padding:20px 20px 24px;
    border:3px solid var(--ink); border-radius:22px; background:var(--paper); color:var(--ink);
    box-shadow:10px 10px 0 var(--ink);
  }
  .demo::backdrop{background:rgba(10,10,10,.55);}
  .demo-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;}
  .demo-head h2{margin:0; font-size:20px; font-weight:900; letter-spacing:-.3px;}
  .demo-x{
    width:40px; height:40px; flex:none; display:grid; place-items:center;
    border:3px solid var(--ink); border-radius:50%; background:#fff; box-shadow:3px 3px 0 var(--ink);
    font-family:inherit; font-size:26px; font-weight:900; line-height:1; color:var(--ink); cursor:pointer; padding:0 0 3px;
  }
  .demo-x:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}

  .d-flip{
    appearance:none; -webkit-appearance:none; border:0; padding:0; background:none; font:inherit; color:inherit;
    display:block; position:relative; width:calc(100% - 8px); height:min(360px, 52dvh);
    margin:0 0 8px; cursor:pointer; perspective:1400px; -webkit-perspective:1400px;
  }
  .d-inner{position:absolute; inset:0; transform-style:preserve-3d; -webkit-transform-style:preserve-3d; transition:transform .6s cubic-bezier(.3, 1.4, .5, 1);}
  .d-flip.flipped .d-inner{transform:rotateY(180deg);}
  .d-face{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:24px 22px 16px; text-align:center;
    border:3px solid var(--ink); border-radius:22px; box-shadow:8px 8px 0 var(--ink);
    backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden;
    transition:visibility 0s linear 75ms;
  }
  .d-front{background:#fff;}
  .d-back{background:var(--yellow); transform:rotateY(180deg); visibility:hidden;}
  .d-flip.flipped .d-front{visibility:hidden;}
  .d-flip.flipped .d-back{visibility:visible;}
  .d-flip:focus-visible{outline:none;}
  .d-flip:focus-visible .d-face{outline:3px dashed var(--ink); outline-offset:6px;}
  .d-tag{
    margin-top:auto; background:var(--yellow); border:2.5px solid var(--ink); border-radius:8px;
    padding:4px 12px; font-size:14px; font-weight:800; box-shadow:3px 3px 0 var(--ink);
  }
  .d-back .d-tag{background:var(--pink);}
  .d-emoji{font-size:clamp(44px, 12vw, 64px); line-height:1;}
  .d-line{margin:0; font-size:clamp(21px, 5.6vw, 28px); font-weight:800; line-height:1.25; text-wrap:balance;}
  .d-back .d-line{font-size:clamp(23px, 6.2vw, 31px); font-weight:900;}
  .d-hint{margin-top:auto; flex-shrink:0; font-size:14px; font-weight:800; color:#777;}
  .d-back .d-hint{color:#5a4a00;}
  .d-pop{animation:d-pop .3s ease;}
  @keyframes d-pop{from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:none;}}

  .d-controls{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px;}
  .d-count{font-size:14px; font-weight:800; color:#555;}
  .d-actions{margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;}
  .d-actions p{margin:0; font-size:15px; font-weight:700; color:#555;}
  .d-actions .btn{width:100%;}
  @media (prefers-reduced-motion:reduce){.d-inner, .d-face{transition:none;} .d-pop{animation:none;}}

  @media (max-width:600px){
    .btn{padding:10px 16px; font-size:16px;}
    .btn-big{padding:16px 28px; font-size:20px;}
    .video{box-shadow:6px 6px 0 var(--ink); border-radius:14px;}
    .peek.p1{left:-12px;}
    .peek.p2{right:-10px;}
  }
  @media (prefers-reduced-motion:reduce){.btn{transition:none;}}
</style>
</head>
<body>

<header class="bar">
  <a class="logo" href="/icebreaker/" aria-label="IceBreaker home">
    <svg viewBox="0 0 52 58" aria-hidden="true"><rect x="16" y="6" width="30" height="40" rx="6" fill="#ffd23f" stroke="#0a0a0a" stroke-width="3" transform="rotate(12 31 26)"/><g transform="rotate(-8 20 26)"><path d="M10 5h22a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H20l-8 8v-8h-2a6 6 0 0 1-6-6V11a6 6 0 0 1 6-6z" fill="#fff" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="round"/><text x="21" y="33" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="22" fill="#0a0a0a">?</text></g></svg>
    <span>IceBreaker</span>
  </a>
  <a class="btn" href="/icebreaker/signup/?mode=login">Log in</a>
</header>

<main>
  <h1 class="hero-logo">
    <svg viewBox="0 0 52 58" aria-hidden="true"><rect x="16" y="6" width="30" height="40" rx="6" fill="#ffd23f" stroke="#0a0a0a" stroke-width="3" transform="rotate(12 31 26)"/><g transform="rotate(-8 20 26)"><path d="M10 5h22a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H20l-8 8v-8h-2a6 6 0 0 1-6-6V11a6 6 0 0 1 6-6z" fill="#fff" stroke="#0a0a0a" stroke-width="3" stroke-linejoin="round"/><text x="21" y="33" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="22" fill="#0a0a0a">?</text></g></svg>
    <span>IceBreaker</span>
  </h1>
  <p class="tag">Flip a card. Start a conversation.</p>
  <span class="ages">For ages 5+</span>

  <div class="hero-actions">
    <button class="btn btn-big btn-try" type="button" data-try>Try it free</button>
  </div>

  <div class="video-wrap">
    <div class="peek p1" aria-hidden="true"></div>
    <div class="peek p2" aria-hidden="true"></div>
    <div class="video">
      <video src="/icebreaker/promo.mp4" controls playsinline preload="metadata" aria-label="IceBreaker product video"></video>
    </div>
  </div>

  <div class="cta">
    <div class="cta-row">
      <a class="btn btn-big" href="/icebreaker/signup/">Sign up free</a>
      <button class="btn btn-big btn-try" type="button" data-try>Try it free</button>
    </div>
    <p>Already have an account? <a href="/icebreaker/signup/?mode=login">Log in</a></p>
    <a class="play-link" href="/icebreaker/play/">Or just start playing →</a>
  </div>
</main>

<footer>IceBreaker by Scott Dickie</footer>

<dialog class="demo" id="demo" aria-labelledby="demoTitle">
  <div class="demo-head">
    <h2 id="demoTitle">Try a card</h2>
    <button class="demo-x" type="button" id="demoClose" aria-label="Close">&times;</button>
  </div>

  <button class="d-flip" id="dCard" type="button" aria-label="Flip the card for a follow-up question">
    <div class="d-inner">
      <div class="d-face d-front">
        <span class="d-tag" id="dTag"></span>
        <div class="d-emoji" id="dEmoji" aria-hidden="true"></div>
        <p class="d-line" id="dQuestion"></p>
        <span class="d-hint">Tap for a follow-up</span>
      </div>
      <div class="d-face d-back" aria-hidden="true">
        <span class="d-tag">FOLLOW-UP</span>
        <p class="d-line" id="dFollow" aria-live="polite"></p>
        <span class="d-hint">Tap to flip back</span>
      </div>
    </div>
  </button>

  <div class="d-controls">
    <span class="d-count" id="dCount"></span>
    <button class="btn" type="button" id="dNext">Next question →</button>
  </div>

  <div class="d-actions">
    <p>Like it? There are hundreds more questions across every topic.</p>
    <a class="btn btn-big" href="/icebreaker/signup/">Sign up free</a>
    <a class="play-link" href="/icebreaker/play/">Play the full game →</a>
  </div>
</dialog>

<script>
  // Old shared links went to /icebreaker#12 to open question 12: send those on to the game.
  if (/^#\d+$/.test(location.hash)) location.replace('/icebreaker/play/' + location.hash);

  // Sample cards, taken from the game's own questions
  const SAMPLES = [
    ['WOULD YOU RATHER', '🦅', 'Would you rather be able to fly or be invisible?', "Where's the first place you'd go?"],
    ['WHAT IF', '🐶', 'What if your pet could talk for one day?', 'What do you think it would complain about?'],
    ['IMAGINE', '🚀', 'If you could visit any planet, which one would you pick?', 'What would you pack for the trip?'],
  ];
  const demo = document.getElementById('demo');
  const card = document.getElementById('dCard');
  const back = card.querySelector('.d-back');
  let i = 0;

  function show(n, animate) {
    const [tag, emoji, q, follow] = SAMPLES[n];
    card.classList.remove('flipped');
    back.setAttribute('aria-hidden', 'true');
    document.getElementById('dTag').textContent = tag;
    document.getElementById('dEmoji').textContent = emoji;
    document.getElementById('dQuestion').textContent = q;
    document.getElementById('dFollow').textContent = follow;
    document.getElementById('dCount').textContent = 'Sample ' + (n + 1) + ' of ' + SAMPLES.length;
    if (animate) { card.classList.remove('d-pop'); void card.offsetWidth; card.classList.add('d-pop'); }
  }

  card.addEventListener('click', () => {
    const flipped = card.classList.toggle('flipped');
    back.setAttribute('aria-hidden', flipped ? 'false' : 'true');
  });
  document.getElementById('dNext').addEventListener('click', () => { i = (i + 1) % SAMPLES.length; show(i, true); });
  document.getElementById('demoClose').addEventListener('click', () => demo.close());
  demo.addEventListener('click', e => { if (e.target === demo) demo.close(); });   // tap outside to close

  document.querySelectorAll('[data-try]').forEach(b => b.addEventListener('click', () => {
    i = 0; show(i, false);
    demo.showModal();
    card.focus();
  }));
</script>

</body>
</html>
