<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IceBreaker | Scott Dickie</title>
<meta name="description" content="240 conversation starters for kids: read the question, tap the card for a follow-up.">
<link rel="icon" href="/assets/favicon.ico">
<style>
  /* Same look as Joke Flip: cream ground, ink outlines, hard offset shadows */
  :root{
    --pink:#ff90e8;
    --yellow:#ffd23f;
    --green:#7ed957;
    --blue:#8fd3ff;
    --ink:#0a0a0a;
    --card:#ffffff;
    --neutral-btn:#eee8dc;
    --shadow-off:5px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Helvetica Neue", Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    background:#f4ede1;
    color:var(--ink);
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;   /* no double-tap zoom when tapping the arrows quickly */
  }
  .wrap{
    width:100%;
    max-width:720px;   /* same width as the topic screen */
    flex:1;
    min-height:0;   /* fills what the top bar leaves */
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* Logo: a speech-bubble question card over a yellow card, then the name */
  .nav-title{
    font-size:clamp(17px, 3.8vw, 28px);
    line-height:1;
    margin:0;
    font-weight:900;
    letter-spacing:-0.5px;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:.3em;
  }
  .logo-mark{height:1.55em; width:auto; flex:none; overflow:visible;}

  /* ---------- the flip card ---------- */
  .stage{
    width:100%;
    flex:1;
    min-height:0;
    position:relative;
  }
  /* The button is absolutely positioned and only holds the perspective; the inner div
     does the 3D turn, which Safari won't do on a button. Sizing comes from fixed insets
     plus max-height - no height percentages anywhere: mobile engines that mis-resolve
     a % height in min()/calc() were collapsing the card to a strip. */
  .flip{
    -webkit-appearance:none;
    appearance:none;
    border:0;
    padding:0;
    background:none;
    font:inherit;
    color:inherit;
    position:absolute;
    left:0;
    top:0;
    bottom:8px;            /* room for the hard shadow */
    width:calc(100% - 8px);
    margin:auto 0;
    cursor:pointer;
    perspective:1400px;
    -webkit-perspective:1400px;
    container-type:size;   /* text inside sizes itself to the card (cqmin = 1% of its shorter side) */
  }
  .inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.3, 1.4, .5, 1);
  }
  .flip.flipped .inner{transform:rotateY(180deg);}
  .flip.instant .inner, .flip.instant .face{transition:none;}
  /* Backup for browsers that ignore backface-visibility: swap faces as the card passes edge-on
     (the easing reaches 90° at 75ms of the 600ms turn, in both directions) */
  .face{transition:visibility 0s linear 75ms;}
  .back, .flip.flipped .front{visibility:hidden;}
  .flip.flipped .back{visibility:visible;}
  .flip.pop{animation:pop .3s ease;}
  @keyframes pop{
    from{opacity:0; transform:translateY(10px) scale(.97);}
    to{opacity:1; transform:none;}
  }
  .face{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:clamp(24px, 5vw, 44px);
    text-align:center;
    border:3px solid var(--ink);
    border-radius:22px;
    box-shadow:8px 8px 0 var(--ink);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  @media (hover:hover){ .flip:hover .face{box-shadow:10px 10px 0 var(--ink);} }
  .front{background:var(--card); transform:rotateY(0deg);}   /* its own 3D layer, so Safari hides it when turned away */
  .back{background:var(--yellow); transform:rotateY(180deg);}
  .flip:focus-visible{outline:none;}
  .flip:focus-visible .face{outline:3px dashed var(--ink); outline-offset:6px;}

  .tag{
    background:var(--yellow);
    border:2.5px solid var(--ink);
    border-radius:8px;
    padding:4px 12px;
    font-weight:800;
    font-size:clamp(13px, 2.4cqmin, 18px);
    box-shadow:3px 3px 0 var(--ink);
  }
  .back .tag{background:var(--pink);}
  .emoji{font-size:clamp(44px, 13cqmin, 104px); line-height:1;}
  .line{
    margin:0;
    font-size:clamp(22px, 6.4cqmin, 48px);
    font-weight:800;
    line-height:1.25;
    text-wrap:balance;
  }
  .back .line{font-size:clamp(24px, 7.2cqmin, 54px); font-weight:900;}
  .hint{
    font-size:clamp(14px, 2.5cqmin, 19px);
    font-weight:800;
    color:#777;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .back .hint{color:#5a4a00;}
  .front .hint::before{content:"👆";}

  /* ---------- big arrows ---------- */
  .controls{
    position:relative; z-index:2;   /* above the team wheel */
    /* full page width, so the arrows sit in the screen's bottom corners even when the card's column is narrower */
    width:calc(100vw - 32px);   /* the column centers it, so it spans edge to edge */
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-top:22px;
    flex-shrink:0;
  }
  .arrow{
    appearance:none;
    width:clamp(76px, 18vw, 104px);
    height:clamp(76px, 18vw, 104px);
    border:3px solid var(--ink);
    border-radius:50%;
    background:var(--neutral-btn);
    color:var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .arrow svg{width:46%; height:46%;}
  @media (hover:hover){
    .arrow:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--ink); background:var(--pink);}
    .arrow.next:hover{background:var(--green);}
  }
  .arrow:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .arrow:focus-visible{outline:3px dashed var(--ink); outline-offset:5px;}
  .middle{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .play{
    appearance:none;
    width:clamp(60px, 14vw, 78px);
    height:clamp(60px, 14vw, 78px);
    border:3px solid var(--ink);
    border-radius:50%;
    background:var(--yellow);
    color:var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .play svg{width:44%; height:44%;}
  .play .stop-icon, .play.playing .play-icon{display:none;}
  .play.playing .stop-icon{display:block;}
  .play.playing{background:var(--pink);}
  .play.waiting{animation:wait 1s ease-in-out infinite;}
  @keyframes wait{50%{transform:scale(1.08);}}
  @media (hover:hover){ .play:hover{transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--ink);} }
  .play:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .play:focus-visible{outline:3px dashed var(--ink); outline-offset:5px;}

  /* Top bar: home (back to the topics) on the left, voice and players on the right */
  .page-nav{
    position:relative; z-index:2;   /* above the team wheel */
    align-self:stretch;
    flex-shrink:0;
    display:flex;   /* home and the logo on the left, voice and players on the right */
    align-items:center;
    gap:12px;
    margin-bottom:22px;
  }
  @media (max-width:400px){   /* phones: slightly smaller round buttons leave the title room */
    .page-nav{gap:10px;}
    .page-nav .players-btn, .page-nav .voice-btn, .page-nav .home-btn{width:40px; height:40px;}
    .nav-right{gap:8px;}
  }
  @media (max-width:350px){   /* the smallest phones */
    .topics .topic-tile .t-name{font-size:15px;}
    .topics .topic-tile{padding-left:12px; padding-right:12px;}
    .page-nav{gap:8px;}
    .page-nav .players-btn, .page-nav .voice-btn, .page-nav .home-btn{width:36px; height:36px;}
    .nav-right{gap:6px;}
  }
  .nav-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
  @media (max-height:640px){
    .emoji{display:none;}
  }
  /* Phones on their side: arrows flank the card instead of taking a row under it */
  @media (max-height:520px) and (orientation:landscape){
    body{padding:10px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));}
    .wrap{
      max-width:960px;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      grid-template-rows:auto minmax(0,1fr) auto auto;
      column-gap:20px;
      align-items:center;
    }
    .nav-title{font-size:17px;}
    .controls{display:contents;}
    #prev{grid-column:1; grid-row:2;}
    .stage{grid-column:2; grid-row:2; height:100%;}
    #next{grid-column:3; grid-row:2;}
    .arrow{width:68px; height:68px; box-shadow:4px 4px 0 var(--ink);}
    .middle{grid-column:1 / -1; grid-row:3; flex-direction:row; justify-content:center; gap:16px; margin-top:6px;}
    .play{width:48px; height:48px; box-shadow:3px 3px 0 var(--ink);}
    .page-nav{margin-bottom:8px;}
    .face{gap:10px; padding:14px 22px; box-shadow:6px 6px 0 var(--ink);}
    .line{font-size:22px;}
    .back .line{font-size:26px;}
  }

  /* ---------- start screen: pick one of the six topics ---------- */
  .topics{
    width:100%; max-width:720px; flex:1; min-height:0; overflow:auto;
    display:flex; flex-direction:column; align-items:center; padding:0 6px 10px;
  }
  .topics[hidden], body.picking .wrap{display:none;}
  .topics .lead{margin:2px 0 18px; font-size:18px; font-weight:800; color:#444;}
  /* Tiles stretch to fill the screen's height; on short screens they keep a minimum and the page scrolls */
  .topic-grid{width:100%; flex:1; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); grid-template-rows:repeat(3, minmax(118px, 1fr)) auto; gap:16px;}
  .topic-tile{
    appearance:none; border:3px solid var(--ink); border-radius:18px; box-shadow:5px 5px 0 var(--ink);
    color:var(--ink); font-family:inherit; text-align:left; cursor:pointer;
    padding:16px 16px 14px; min-height:118px;
    display:flex; flex-direction:column; justify-content:space-between; gap:8px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .topic-tile .t-emoji{font-size:clamp(34px, 5.5vw, 52px); line-height:1;}
  .topic-tile .t-name{font-size:clamp(18px, 3vw, 26px); font-weight:900; line-height:1.15;}
  .topic-tile .t-count{font-size:clamp(13px, 1.8vw, 16px); font-weight:800; opacity:.7;}
  @media (hover:hover){ .topic-tile:hover{transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--ink);} }
  .topic-tile:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .topic-tile:focus-visible{outline:3px dashed var(--ink); outline-offset:4px;}
  .topic-tile.random{
    grid-column:1 / -1; min-height:0; flex-direction:row; align-items:center; justify-content:flex-start; gap:14px;
    background:#fff;
    background-image:linear-gradient(90deg, #c9a7ff, #7ed957, #8fd3ff, #ff90e8, #ffb26b, #ffd23f);
    background-size:100% 10px; background-repeat:no-repeat; background-position:bottom;
    padding-bottom:22px;
  }
  .topic-tile.random .t-text{display:flex; flex-direction:column; gap:4px;}
  body.picking .topics .pop-in{animation:pop .4s cubic-bezier(.3, 1.5, .5, 1) both;}
  .topic-tile.chosen{transform:scale(1.07) rotate(-1.5deg); box-shadow:8px 8px 0 var(--ink);}

  /* ---------- intro: the logo pops in mid-screen, then shrinks up into the top bar ---------- */
  .splash{
    position:fixed; inset:0; z-index:100; display:grid; place-items:center;
    background:#f4ede1; transition:background-color .6s ease;
  }
  .splash.leaving{background-color:rgba(244, 237, 225, 0);}
  .splash-logo{
    grid-column:auto;   /* it borrows .nav-title's look, not its top-bar column */
    font-size:clamp(48px, 13vw, 104px);
    transform-origin:50% 50%;
  }
  /* The logo mark in the intro, as two cards laid out exactly like the logo's 52x58 drawing */
  .splash-mark{position:relative; height:1.55em; width:calc(1.55em * 52 / 58); flex:none; perspective:6em;}
  .sc-y, .sc-w{position:absolute; transform-style:preserve-3d;}
  .sc-y{
    left:calc(16 / 52 * 100%); top:calc(6 / 58 * 100%); width:calc(30 / 52 * 100%); height:calc(40 / 58 * 100%);
    box-sizing:border-box; border:calc(1.55em * 3 / 58) solid var(--ink); border-radius:calc(1.55em * 6 / 58);
    background:var(--yellow); transform:rotate(12deg);
  }
  .sc-w{
    left:calc(4 / 52 * 100%); top:calc(5 / 58 * 100%); width:calc(34 / 52 * 100%); height:calc(48 / 58 * 100%);
    transform-origin:47% 44%; transform:rotate(-8deg);
  }
  .sc-face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;}
  .sc-face svg{display:block; width:100%; height:100%; overflow:visible;}
  .sc-back{transform:rotateY(180deg);}   /* its other side also shows a ? */
  /* Intro: both cards fly in from opposite sides, flipping a full turn, then the name slides in */
  .splash-logo .sc-y{animation:fly-y .7s cubic-bezier(.2, .85, .3, 1.15) both;}
  .splash-logo .sc-w{animation:fly-w .6s cubic-bezier(.2, .85, .3, 1.1) .1s both, flip-w .7s cubic-bezier(.45, 0, .25, 1) .65s both;}
  .splash-logo .logo-word{animation:word-in .4s ease .75s both;}
  @keyframes fly-y{from{transform:translateX(-60vw) rotate(-25deg) rotateY(0);}to{transform:rotate(12deg) rotateY(360deg);}}
  @keyframes fly-w{from{transform:translateX(60vw) rotate(20deg);}to{transform:rotate(-8deg);}}
  @keyframes flip-w{   /* once it has landed, the white card flips a full turn so you can see both ? sides */
    0%{transform:rotate(-8deg) rotateY(0) scale(1);}
    50%{transform:rotate(-8deg) rotateY(-180deg) scale(1.25);}
    100%{transform:rotate(-8deg) rotateY(-360deg) scale(1);}
  }
  @keyframes word-in{from{opacity:0; transform:translateX(-.4em);}to{opacity:1; transform:none;}}
  /* Until the logo starts moving, everything else waits; tiles hold their pop-in */
  body.intro .page-nav > :not(.nav-title), body.intro .topics .lead, body.intro .wrap{opacity:0;}
  body.landing .page-nav > :not(.nav-title), body.landing .topics .lead, body.landing .wrap{transition:opacity .5s ease .15s;}
  body.intro .topic-tile{animation-play-state:paused;}
  body.intro .page-nav .nav-title, body.landing .page-nav .nav-title{visibility:hidden;}
  body:not(.picking) .page-nav .nav-title{display:none;}   /* the logo only shows on the topic screen */

  /* ---------- emoji explosion when a topic is picked ---------- */
  .burst{position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden;}
  .wipe{position:fixed; inset:0; pointer-events:none; z-index:150;}   /* the tile's color, under the emojis */
  .burst span{position:absolute; line-height:1; will-change:transform, opacity;}
  @media (max-height:700px){
    .topic-tile{min-height:96px; padding:12px 14px;}
    .topic-tile .t-emoji{font-size:28px;}
    .topics .lead{margin-bottom:12px;}
  }

  /* ---------- players: the card's border is split into one colored side per player ---------- */
  .players-btn, .voice-btn, .home-btn{
    position:relative; appearance:none; margin-left:auto; width:44px; height:44px; padding:0; flex:none;
    border:3px solid var(--ink); border-radius:50%; background:var(--green); color:var(--ink);
    box-shadow:3px 3px 0 var(--ink); cursor:pointer; display:grid; place-items:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .players-btn svg, .voice-btn svg, .home-btn svg{width:58%; height:58%;}
  .home-btn{margin-left:0; background:transparent;}            /* outline only away from home */
  body.picking .home-btn{background:var(--blue); cursor:default;}   /* filled: you're on the topic screen */
  .voice-btn{background:var(--neutral-btn);}
  .voice-btn[aria-pressed="true"]{background:var(--yellow);}
  .voice-btn .waves, .voice-btn[aria-pressed="true"] .slash{display:none;}
  .voice-btn[aria-pressed="true"] .waves{display:inline;}
  .players-btn .badge{
    position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; padding:0 5px;
    border:2.5px solid var(--ink); border-radius:11px; background:var(--yellow);
    font-size:12px; font-weight:900; line-height:17px;
  }
  .players-btn .badge:empty{display:none;}
  @media (hover:hover){ .players-btn:hover, .voice-btn:hover, .home-btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);} }
  .players-btn:active, .voice-btn:active, .home-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .players-btn:focus-visible, .voice-btn:focus-visible, .home-btn:focus-visible{outline:3px dashed var(--ink); outline-offset:4px;}

  .sides{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0;}
  .stage.ringed .flip{z-index:1;}
  .sides.full{position:fixed; inset:0; width:100vw; height:100vh;}   /* ?wheel=full: wedges behind the whole page */
  .stage.ringed.fullwheel .flip{left:30px; width:calc(100% - 68px);}   /* leave the side wedges room to show */   /* sized by drawSides() to sit on the wheel */
  /* A short card (team play on a phone) tightens up so the question, the winner and the hint all fit */
  @container (max-height:360px){
    .face{gap:8px; padding:14px 14px;}
    .emoji{font-size:34px;}
    .hint.picked{gap:6px;}
    .hint .who{font-size:16px; padding:3px 10px;}
    .line{font-size:20px;}
    .back .line{font-size:22px;}
  }
  @container (max-height:240px){ .emoji{display:none;} }
  .face.tight{gap:6px; padding-top:10px; padding-bottom:10px;}
  .face.tight .emoji{display:none;}
  .sides path{stroke:var(--ink); stroke-width:3; stroke-linejoin:round; transition:opacity .15s;}
  .sides .chip text{font:900 26px/1 "Helvetica Neue", Arial, sans-serif; fill:var(--ink); text-anchor:middle; dominant-baseline:central;}
  .sides .chip{transition:opacity .15s;}
  /* Raffle: only the lit side shows while the light runs; after landing the winner stays lit */
  .sides.running path, .sides.running .chip, .sides.landed path, .sides.landed .chip{opacity:.18;}
  .sides.running .lit, .sides.landed .lit{opacity:1;}
  .sides.landed path.lit{animation:glow .5s ease 3;}
  @keyframes glow{50%{opacity:.45;}}
  .hint.picked{flex-direction:column; gap:10px;}
  .hint.picked::before{display:none;}
  .hint .who{padding:4px 12px; border:2.5px solid var(--ink); border-radius:8px; box-shadow:3px 3px 0 var(--ink); color:var(--ink); font-size:clamp(18px, 3.2cqmin, 24px); font-weight:900;}

  dialog.spin{
    width:min(400px, calc(100vw - 32px));
    padding:26px 22px 22px;
    border:3px solid var(--ink);
    border-radius:22px;
    background:#fffaf0;
    color:var(--ink);
    box-shadow:8px 8px 0 var(--ink);
    text-align:center;
    font-family:inherit;
  }
  dialog.spin::backdrop{background:rgba(10,10,10,.35);}
  dialog.spin[open]{animation:pop .25s ease;}
  .spin h2{margin:0; padding:0 26px; font-size:28px; font-weight:900; letter-spacing:-.3px;}
  .spin .sub{margin:6px 0 18px; font-size:15px; font-weight:600; color:#555;}
  .spin .x{
    position:absolute; top:10px; right:10px; width:40px; height:40px;
    appearance:none; border:0; background:none; color:var(--ink); cursor:pointer;
    font-family:inherit; font-size:30px; font-weight:900; line-height:1; border-radius:50%;
  }
  .spin .x:focus-visible{outline:3px dashed var(--ink);}
  .stepper{display:flex; align-items:center; justify-content:center; gap:22px; margin:8px 0 24px;}
  .step-btn{
    appearance:none; width:60px; height:60px; border:3px solid var(--ink); border-radius:50%;
    background:var(--neutral-btn); color:var(--ink); box-shadow:4px 4px 0 var(--ink);
    font-family:inherit; font-size:34px; font-weight:900; line-height:1; cursor:pointer; display:grid; place-items:center; padding:0 0 3px;
  }
  .step-btn:disabled{opacity:.35; cursor:default;}
  .step-btn:not(:disabled):active, .big-btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .count{font-size:64px; font-weight:900; min-width:1.4em; line-height:1;}
  .big-btn{
    appearance:none; border:3px solid var(--ink); border-radius:14px; background:var(--yellow);
    color:var(--ink); box-shadow:5px 5px 0 var(--ink); font-family:inherit; font-size:20px; font-weight:900; line-height:1;
    padding:15px 30px; cursor:pointer;
  }
  .link-btn{
    appearance:none; border:0; background:none; font:inherit; font-size:14px; font-weight:800;
    color:#777; text-decoration:underline; cursor:pointer; margin-top:16px; padding:4px;
  }

  @media (prefers-reduced-motion: reduce){
    .inner, .face{transition:none;}
    .flip.pop{animation:none;}
    .play.waiting{animation:none;}
    .sides.landed path.lit{animation:none;}
    dialog.spin[open]{animation:none;}
  }
</style>
</head>

// A link to a question (#7) opens it in its topic; otherwise the page starts on the topic screen
const linked = parseInt(location.hash.slice(1), 10);
let index = linked >= 1 && linked <= PROMPTS.length ? linked - 1 : 0;
let flipped = false;
let topic = PROMPTS[index][0];
let deck = [];   // question numbers (0-based) in the chosen topic, in order
const topicOf = id => TOPICS.find(t => t.id === id);

function setFlipped(next){
  flipped = next;
  card.classList.toggle('flipped', flipped);
  back.setAttribute('aria-hidden', String(!flipped));
  card.setAttribute('aria-label', flipped ? 'Flip the card back to the question' : 'Flip the card for a follow-up question');
}

function show(i, quiet){
  index = i;
  // Turn the card back to its front with no animation first, so the next follow-up never shows mid-flip
  card.classList.add('instant');
  setFlipped(false);
  const [, type, emoji, question, follow] = PROMPTS[index];
  els.tag.textContent = type;
  els.emoji.textContent = emoji;
  els.question.textContent = question;
  els.follow.textContent = follow;
  resetPick();
  if (!quiet) present();
  history.replaceState(null, '', '#' + (index + 1));
  card.classList.remove('pop');
  void card.offsetWidth;
  card.classList.remove('instant');
  card.classList.add('pop');
}
const go = (delta) => {
  const at = deck.indexOf(index);
  show(deck[(at + delta + deck.length) % deck.length]);
};


card.addEventListener('animationend', () => card.classList.remove('pop'));
// A new question: in team play, pick who answers first (the raffle reads the question when it lands);
// otherwise read it straight away. Called inside a tap, so iPhone allows the sound that follows.
let startTimer = null;
function present(){
  clearTimeout(startTimer);
  if (!players) return speak();
  audio();         // unlock the raffle ticks
  primeVoice();    // and John's voice, for after the pick
  const at = index;
  startTimer = setTimeout(() => {   // let the card settle first
    if (index === at && !flipped && picked === null && !raffling && !document.body.classList.contains('picking')) raffle();
  }, 450);
}
card.addEventListener('click', () => {
  if (raffling) return;
  if (players && picked === null && !flipped) raffle();   // tap to pick, if it hasn't run yet
  else flipAndRead();
});
// The follow-up is read when the card turns over; turning back to the question doesn't repeat it
function flipAndRead(){
  setFlipped(!flipped);
  if (flipped) speak(); else voice.pause();
}
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));

// Keyboard: arrows to move, space or enter flips (the card button handles those when focused)
addEventListener('keydown', e => {
  if (document.body.classList.contains('picking')) return;
  if (spinDlg.open) return;   // the spinner has its own focus; leave the card alone
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === document.body) { e.preventDefault(); flipAndRead(); }
});

// Swipe left or right on a phone to change questions
let startX = null, startY = null;
card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
card.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
  startX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    e.preventDefault();   // a swipe is not also a tap-to-flip
    go(dx < 0 ? 1 : -1);
  }
});

// ---------- players: the card's border is split into one side per player ----------
// Tapping a new question runs a light around the sides (with raffle ticks) and lands on who answers.
// The player count is remembered on this device.
const SEAT_COLORS = ['#ff90e8', '#ffd23f', '#7ed957', '#8fd3ff', '#ffb26b', '#c9a7ff', '#7fe0d0', '#ff8a8a'];
const MIN_PLAYERS = 2, MAX_PLAYERS = 8;
const SVGNS = 'http://www.w3.org/2000/svg';
const spinDlg = document.getElementById('spinDlg');
const sides = document.getElementById('sides');
const front = card.querySelector('.front');
const hint = document.getElementById('hintFront');
const countEl = document.getElementById('count');
let players = 0, draft = 4, picked = null, lit = 0, raffling = false, raffleTimer = null;
// Players mode starts off on every visit; the last count used only pre-fills the panel
let lastCount = 4;
try { lastCount = parseInt(localStorage.getItem('icebreaker-players'), 10) || 4; } catch (e) {}
if (lastCount < MIN_PLAYERS || lastCount > MAX_PLAYERS) lastCount = 4;

// One rounded-rectangle path just inside the card's ink border, starting at top-center and running clockwise.
// Each player gets an equal length of it; player 1 is centered at the top.
const stage = document.querySelector('.stage');
// Team play's wedges fill the whole screen behind everything, and the card keeps its full size.
// ?wheel=round shows the older round wheel behind a smaller card, for comparison.
const FULL_WHEEL = new URLSearchParams(location.search).get('wheel') !== 'round';
function drawSides(){
  stage.classList.toggle('ringed', !!players);
  sides.innerHTML = '';
  if (!players) { card.style.cssText = ''; return; }
  if (FULL_WHEEL) return drawFullWheel();
  const W = stage.clientWidth, H = stage.clientHeight;
  if (!W || !H) return;
  // A round wheel as wide as the stage allows (a little past it on phones), centered;
  // the card sits on it, sized so the wheel's curve shows all around and only its corners poke past
  // The card keeps the size it had on the wheel; the wheel itself is about a third bigger and on phones
  // runs past the screen edges. Where height is the limit (desktop), the card steps down a little instead.
  const base = Math.min(W * 1.1, H);
  const D = Math.min(W * 1.8, H * 1.2), R = D / 2, cx = W / 2, cy = H / 2;   // may reach behind the top bar and arrows
  const cardScale = D > base * 1.05 ? 1 : .86;
  const fw = Math.round(base * .62 * cardScale), fh = Math.round(Math.min(base * .7 * cardScale, H - 16));
  const css = `left:${Math.round(cx - fw / 2)}px; top:${Math.round(cy - fh / 2)}px; width:${fw}px; height:${fh}px; bottom:auto; margin:0;`;
  if (card.style.cssText !== css) { card.style.cssText = css; requestAnimationFrame(fitCard); }
  sides.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const step = 360 / players;
  const dir = deg => [Math.sin(deg * Math.PI / 180), -Math.cos(deg * Math.PI / 180)];   // 0deg = straight up, clockwise
  const at = (deg, r) => { const [dx, dy] = dir(deg); return [cx + dx * r, cy + dy * r]; };
  for (let p = 0; p < players; p++) {   // one wedge per player, player 1 centered at the top
    const a0 = p * step - step / 2, a1 = a0 + step;
    const [x0, y0] = at(a0, R), [x1, y1] = at(a1, R);
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', `M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${step > 180 ? 1 : 0} 1 ${x1} ${y1} Z`);
    path.setAttribute('fill', SEAT_COLORS[p]);
    path.dataset.p = p;
    sides.appendChild(path);
  }
  for (let p = 0; p < players; p++) {   // each number sits in the visible band between the card and the rim
    const [dx, dy] = dir(p * step);
    const toEdge = (half, d) => Math.abs(d) < 1e-6 ? Infinity : half / Math.abs(d);
    const tCard = Math.min(toEdge(fw / 2, dx), toEdge(fh / 2, dy));
    const shadow = (dx > .3 || dy > .3) ? 5 : 0;   // clear the card's drop shadow on the right and bottom
    const tView = Math.min(dx > 0 ? (W + 8 - cx) / dx : dx < 0 ? (cx + 8) / -dx : Infinity,   // stay on screen
                           dy > 0 ? (H - cy) / dy : dy < 0 ? cy / -dy : Infinity) - 16;
    const t = Math.min(Math.max(tCard + 16 + shadow, (tCard + shadow + R) / 2), Math.max(tCard + 16 + shadow, tView));
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'chip');
    g.dataset.p = p;
    g.innerHTML = `<text x="${cx + dx * t}" y="${cy + dy * t + 1}">${p + 1}</text>`;
    sides.appendChild(g);
  }
  paint();
}
function drawFullWheel(){
  sides.classList.add('full');
  stage.classList.add('fullwheel');
  const W = innerWidth, H = innerHeight;
  const sr = stage.getBoundingClientRect();
  // Center the card on the screen, as big as it can be without reaching the top bar or the arrows
  const navBottom = document.querySelector('.page-nav').getBoundingClientRect().bottom;
  const ctrlTop = document.querySelector('.controls').getBoundingClientRect().top;
  const half = Math.max(80, Math.min(H / 2 - navBottom - 14, ctrlTop - H / 2 - 22));   // 22: room for the shadow
  const fw = Math.round(Math.min(sr.width - 68, 712)), fh = Math.round(half * 2);
  const css = `left:${Math.round(W / 2 - sr.left - fw / 2)}px; top:${Math.round(H / 2 - sr.top - fh / 2)}px; width:${fw}px; height:${fh}px; bottom:auto; margin:0;`;
  if (card.style.cssText !== css) { card.style.cssText = css; requestAnimationFrame(fitCard); }
  // Equal slices of a wheel centered on the screen, big enough to reach every corner
  const cx = W / 2, cy = H / 2;
  const R = Math.hypot(cx, cy) + 4;
  const kx = cx, ky = cy;   // the card is centered on the screen too
  sides.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const step = 360 / players;
  const dir = deg => [Math.sin(deg * Math.PI / 180), -Math.cos(deg * Math.PI / 180)];   // 0deg = straight up, clockwise
  const at = (deg, r) => { const [dx, dy] = dir(deg); return [cx + dx * r, cy + dy * r]; };
  for (let p = 0; p < players; p++) {   // player 1 centered at the top
    const a0 = p * step - step / 2, a1 = a0 + step;
    const [x0, y0] = at(a0, R), [x1, y1] = at(a1, R);
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', `M${cx} ${cy} L${x0} ${y0} A${R} ${R} 0 ${step > 180 ? 1 : 0} 1 ${x1} ${y1} Z`);
    path.setAttribute('fill', SEAT_COLORS[p]);
    path.dataset.p = p;
    sides.appendChild(path);
  }
  for (let p = 0; p < players; p++) {   // numbers on each slice's middle line, between the card and the screen edge
    const [dx, dy] = dir(p * step);
    const tView = Math.min(dx > 0 ? (W - cx) / dx : dx < 0 ? cx / -dx : Infinity,
                           dy > 0 ? (H - cy) / dy : dy < 0 ? cy / -dy : Infinity);
    // where this line leaves the card (the card is centered at kx, ky)
    const hx = fw / 2, hy = fh / 2;
    let tCard = 0;
    for (let t = 0; t < tView; t += 2) {
      const x = cx + dx * t, y = cy + dy * t;
      if (Math.abs(x - kx) > hx + ((dx > .3) ? 5 : 0) || Math.abs(y - ky) > hy + ((dy > .3) ? 5 : 0)) { tCard = t; break; }
    }
    const t = tCard + Math.max(18, (tView - tCard) / 2);
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'chip');
    g.dataset.p = p;
    g.innerHTML = `<text x="${cx + dx * t}" y="${cy + dy * t + 1}">${p + 1}</text>`;
    sides.appendChild(g);
  }
  paint();
}
function paint(){
  sides.classList.toggle('running', raffling);
  sides.classList.toggle('landed', !raffling && picked !== null);
  sides.querySelectorAll('[data-p]').forEach(el => el.classList.toggle('lit', +el.dataset.p === lit));
}
function setHint(){
  if (!players) hint.textContent = 'Tap for a follow-up';
  else if (raffling) hint.textContent = 'Picking…';
  else if (picked === null) hint.textContent = 'Tap to see who answers';
  else hint.innerHTML = '<span class="who" style="background:' + SEAT_COLORS[picked] + '">Player ' + (picked + 1) + ' answers!</span><span>👆 Tap for a follow-up</span>';
  hint.classList.toggle('picked', !!players && !raffling && picked !== null);
  fitCard();
}
// On the smaller team-play card a long question can run out of room: drop the emoji when it does
function fitCard(){
  const face = card.querySelector('.face.front');
  face.classList.remove('tight');
  if (players && face.scrollHeight > face.clientHeight + 1) face.classList.add('tight');
}
function resetPick(){
  clearTimeout(raffleTimer);
  raffling = false;
  picked = null;
  paint();
  setHint();
}

// ---- sound: short raffle ticks that slow down, then a two-note ding (Web Audio, no files) ----
let actx = null;
function audio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
  return actx;
}
function tone(freq, start, dur, type, vol){
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, a.currentTime + start);
  g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + start + dur);
  o.connect(g).connect(a.destination);
  o.start(a.currentTime + start); o.stop(a.currentTime + start + dur + .02);
}
const tick = () => { tone(1800, 0, .03, 'square', .08); tone(900, 0, .04, 'triangle', .1); };
const ding = () => { tone(880, 0, .35, 'triangle', .22); tone(1320, .12, .5, 'triangle', .2); };

function raffle(){
  audio();   // created inside the tap so iPhone allows sound
  raffling = true;
  const winner = Math.floor(Math.random() * players);
  const rounds = Math.max(2, Math.ceil(22 / players));
  const steps = rounds * players + ((winner - lit + players) % players);
  let n = 0;
  setHint();
  paint();
  const step = () => {
    if (!raffling) return;
    n++;
    lit = (lit + 1) % players;
    tick();
    paint();
    if (n >= steps) {
      raffling = false;
      picked = lit;
      paint();
      setHint();
      ding();
      const at = index;
      setTimeout(() => { if (index === at && !flipped && picked !== null) speak(); }, 500);   // then John reads the question
      return;
    }
    const t = n / steps;
    raffleTimer = setTimeout(step, 40 + 360 * t * t * t);   // fast at first, slowing to a stop
  };
  raffleTimer = setTimeout(step, 40);
}

// ---- the players panel ----
function updateCount(){
  countEl.textContent = draft;
  document.getElementById('fewer').disabled = draft <= MIN_PLAYERS;
  document.getElementById('more').disabled = draft >= MAX_PLAYERS;
}
function setPlayers(n){
  players = n;
  if (n) { lastCount = n; try { localStorage.setItem('icebreaker-players', n); } catch (e) {} }
  document.getElementById('playersBadge').textContent = n || '';
  lit = 0;
  drawSides();
  resetPick();
  if (n && !voiceOn) setVoice(true, true);   // team play reads each question after the pick, so voice comes on too
  if (n && !document.body.classList.contains('picking')) present();   // turning team play on picks right away
}
document.getElementById('playersBtn').addEventListener('click', () => {
  draft = players || lastCount;
  updateCount();
  document.getElementById('playersOff').hidden = !players;
  spinDlg.showModal();
});
document.getElementById('fewer').addEventListener('click', () => { draft = Math.max(MIN_PLAYERS, draft - 1); updateCount(); });
document.getElementById('more').addEventListener('click', () => { draft = Math.min(MAX_PLAYERS, draft + 1); updateCount(); });
document.getElementById('playersGo').addEventListener('click', () => { setPlayers(draft); spinDlg.close(); });
document.getElementById('playersOff').addEventListener('click', () => { setPlayers(0); spinDlg.close(); });
document.getElementById('spinClose').addEventListener('click', () => spinDlg.close());
spinDlg.addEventListener('click', e => {   // a tap on the backdrop, outside the panel, closes it
  const r = spinDlg.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) spinDlg.close();
});
const ringWatch = new ResizeObserver(drawSides);
ringWatch.observe(stage);
ringWatch.observe(card);
addEventListener('resize', () => { if (FULL_WHEEL && players) drawSides(); });
document.getElementById('playersBadge').textContent = players || '';

// ---------- voice mode: John reads the question, and the follow-up when the card flips ----------
// Clips are pre-made by make-audio.py (icebreaker/audio/N-question.mp3, N-follow.mp3).
// One <audio> element is reused, and every play starts from a tap, so iPhone allows it.
const voice = new Audio();
const voiceBtn = document.getElementById('voiceBtn');
let voiceOn = false;
try { voiceOn = localStorage.getItem('icebreaker-voice') === '1'; } catch (e) {}
function clipSrc(){ return '/icebreaker/audio/' + (index + 1) + '-' + (flipped ? 'follow' : 'question') + '.mp3'; }
function speak(){
  if (!voiceOn) return;
  voice.pause();
  voice.muted = false;
  voice.src = clipSrc();
  voice.play().catch(() => {});   // a page load can't autoplay; the next tap will
}
// iPhone only lets audio start inside a tap. When the reading has to wait (the topic transition),
// play the clip silently during the tap and stop it at once: that unlocks the player for later.
function primeVoice(){
  if (!voiceOn) return;
  voice.pause();
  voice.muted = true;
  voice.src = clipSrc();
  voice.play().then(() => { if (voice.muted) { voice.pause(); voice.currentTime = 0; voice.muted = false; } },
                    () => { voice.muted = false; });
}
function setVoice(on, quiet){
  voiceOn = on;
  voiceBtn.setAttribute('aria-pressed', String(on));
  voiceBtn.setAttribute('aria-label', on ? 'Stop reading the questions out loud' : 'Read the questions out loud');
  try { localStorage.setItem('icebreaker-voice', on ? '1' : '0'); } catch (e) {}
  if (!on) voice.pause();
  else if (!quiet) speak();
}
voiceBtn.addEventListener('click', () => setVoice(!voiceOn));
voiceBtn.setAttribute('aria-pressed', String(voiceOn));

// ---------- start screen: pick a topic ----------
const TOPIC_EMOJI = { magic: '🪄', animals: '🐾', places: '🗺️', friends: '💛', family: '🏡', me: '🌟' };
const topicsEl = document.getElementById('topics');
const homeBtn = document.getElementById('homeBtn');
document.getElementById('topicGrid').innerHTML = TOPICS.map((t, i) => {
  const n = PROMPTS.filter(p => p[0] === t.id).length;
  return '<button class="topic-tile pop-in" type="button" data-topic="' + t.id + '" style="background:' + t.color +
    '; animation-delay:' + (80 + i * 70) + 'ms"><span class="t-emoji" aria-hidden="true">' + TOPIC_EMOJI[t.id] +
    '</span><span class="t-name">' + t.name + '</span><span class="t-count">' + n + ' questions</span></button>';
}).join('') +
  '<button class="topic-tile random pop-in" type="button" data-topic="random" style="animation-delay:' + (80 + TOPICS.length * 70) + 'ms">' +
  '<span class="t-emoji" aria-hidden="true">🎲</span><span class="t-text"><span class="t-name">Random</span>' +
  '<span class="t-count">All ' + PROMPTS.length + ' questions, mixed up</span></span></button>';

function useTopic(id){
  topic = id;
  if (id === 'random') {
    deck = PROMPTS.map((_, i) => i);
    for (let i = deck.length - 1; i > 0; i--) {   // shuffle, new order every time
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    homeBtn.setAttribute('aria-label', 'Change topic (now: Random)');
    return;
  }
  deck = PROMPTS.map((p, i) => p[0] === id ? i : -1).filter(i => i >= 0);
  homeBtn.setAttribute('aria-label', 'Change topic (now: ' + topicOf(id).name + ')');
}
function openTopics(){
  voice.pause();
  resetPick();
  document.body.classList.add('picking');
  homeBtn.setAttribute('aria-current', 'page');
  topicsEl.hidden = false;
  history.replaceState(null, '', location.pathname + location.search);
}
const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BURST_EMOJI = {
  magic:   ['🪄', '✨', '🔮', '⭐', '🧞', '🦄', '💫'],
  animals: ['🐾', '🐶', '🦁', '🐸', '🦋', '🐢', '🌻'],
  places:  ['🗺️', '🚀', '🏝️', '🏰', '🧭', '🎈', '🌋'],
  friends: ['💛', '🤝', '😊', '🫶', '💬', '🌈', '🎉'],
  family:  ['🏡', '❤️', '🍕', '🎂', '🧸', '🍿', '🥞'],
  me:      ['🌟', '🎨', '🎸', '📚', '🏆', '💡', '🚲']
};
BURST_EMOJI.random = Object.values(BURST_EMOJI).flat();

// Emojis fly out from (x, y), arc down a little and fade
function burst(x, y, set){
  const layer = document.createElement('div');
  layer.className = 'burst';
  document.body.appendChild(layer);
  for (let n = 0; n < 34; n++) {
    const e = document.createElement('span');
    const size = 22 + Math.random() * 26;
    e.textContent = set[Math.floor(Math.random() * set.length)];
    e.style.cssText = 'left:' + x + 'px; top:' + y + 'px; font-size:' + size + 'px; margin:' + (-size / 2) + 'px 0 0 ' + (-size / 2) + 'px;';
    layer.appendChild(e);
    const a = Math.random() * Math.PI * 2, d = 140 + Math.random() * Math.max(innerWidth, innerHeight) * .45;
    const tx = Math.cos(a) * d, ty = Math.sin(a) * d - 60, spin = (Math.random() - .5) * 540;
    e.animate([
      { transform: 'translate(0, 0) scale(.2) rotate(0deg)', opacity: 1 },
      { transform: `translate(${tx * .75}px, ${ty * .75}px) scale(1.15) rotate(${spin * .6}deg)`, opacity: 1, offset: .55 },
      { transform: `translate(${tx}px, ${ty + 160}px) scale(.85) rotate(${spin}deg)`, opacity: 0 }
    ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.12, .75, .3, 1)', fill: 'forwards' });
  }
  setTimeout(() => layer.remove(), 1800);
}

let choosing = false;
function chooseTopic(id, tile){
  if (choosing) return;
  useTopic(id);
  index = deck[0];
  setFlipped(false);
  const first = index;
  const finish = () => {
    topicsEl.hidden = true;
    document.body.classList.remove('picking');
    homeBtn.removeAttribute('aria-current');
    show(deck[0], true);
    if (tile) tile.classList.remove('chosen');
    choosing = false;
  };
  if (REDUCE_MOTION || !tile) { finish(); present(); return; }
  primeVoice();   // unlock audio inside this tap; John reads once the card is fully showing
  if (players) audio();
  choosing = true;
  tile.classList.add('chosen');
  const r = tile.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  wipe(x, y, id === 'random'
    ? 'linear-gradient(135deg, ' + TOPICS.map(t => t.color).join(', ') + ')'
    : topicOf(id).color);
  burst(x, y, BURST_EMOJI[id]);
  setTimeout(finish, 480);   // swap to the card while the screen is fully covered
  setTimeout(() => {          // the color has faded (560ms delay + 520ms fade): now read the question
    if (index !== first || flipped || document.body.classList.contains('picking')) return;
    if (players) raffle(); else speak();   // team play: pick who answers first, then read
  }, 1120);
}

// The tile's color grows from the tile to fill the whole screen, then fades away to show the card
function wipe(x, y, paint){
  const el = document.createElement('div');
  el.className = 'wipe';
  el.style.background = paint;
  document.body.appendChild(el);
  const reach = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  el.animate([
    { clipPath: 'circle(0px at ' + x + 'px ' + y + 'px)' },
    { clipPath: 'circle(' + reach + 'px at ' + x + 'px ' + y + 'px)' }
  ], { duration: 460, easing: 'cubic-bezier(.55, 0, .35, 1)', fill: 'forwards' });
  el.animate([{ opacity: 1 }, { opacity: 0 }],
    { duration: 520, delay: 560, easing: 'ease-out', fill: 'forwards' })
    .finished.then(() => el.remove(), () => el.remove());
}
document.getElementById('topicGrid').addEventListener('click', e => {
  const tile = e.target.closest('.topic-tile');
  if (tile) chooseTopic(tile.dataset.topic, tile);
});
homeBtn.addEventListener('click', () => { if (!document.body.classList.contains('picking')) openTopics(); });

useTopic(topic);
if (linked >= 1 && linked <= PROMPTS.length) show(index);
else openTopics();

// ---------- intro: logo pops in, then shrinks and flies to its spot in the top bar ----------
(function intro(){
  const splash = document.getElementById('splash');
  const done = () => { splash.remove(); document.body.classList.remove('intro', 'landing'); };
  if (REDUCE_MOTION) return done();
  const logo = splash.querySelector('.splash-logo');
  setTimeout(() => {
    logo.getAnimations({ subtree: true }).forEach(an => an.finish());   // settle the pop-in before measuring
    const to = document.querySelector('.page-nav .nav-title').getBoundingClientRect();
    if (!to.width) {   // a question page has no logo in the top bar: shrink away in place
      logo.style.transition = 'transform .5s cubic-bezier(.6, 0, .4, 1), opacity .5s ease';
      logo.style.transform = 'scale(.6)';
      logo.style.opacity = '0';
    } else {
      // Layout size and position, which ignore any transform still on the logo
      const w = logo.offsetWidth, cx = logo.offsetLeft + w / 2, cy = logo.offsetTop + logo.offsetHeight / 2;
      const dx = (to.left + to.width / 2) - cx;
      const dy = (to.top + to.height / 2) - cy;
      logo.style.transition = 'transform .75s cubic-bezier(.65, 0, .25, 1)';
      logo.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + (to.width / w) + ')';
    }
    splash.classList.add('leaving');
    document.body.classList.add('landing');
    document.body.classList.remove('intro');   // tiles, buttons and card come in as the logo moves
    setTimeout(done, 780);
  }, 1450);   // after the white card's flip has finished
})();
</script>
