<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joke Flip | Scott Dickie</title>
<meta name="description" content="Kid-friendly jokes: read the setup, tap the card to flip it for the punchline.">
<link rel="icon" href="/assets/favicon.ico">
<style>
  /* Same look as the Should I Buy It? wizard: cream ground, ink outlines, hard offset shadows */
  :root{
    --pink:#ff90e8;
    --yellow:#ffd23f;
    --green:#7ed957;
    --blue:#8fd3ff;
    --ink:#0a0a0a;
    --card:#ffffff;
    --neutral-btn:#eee8dc;
    --shadow-off:5px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Helvetica Neue", Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    background:#f4ede1;
    color:var(--ink);
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;   /* no double-tap zoom when tapping the arrows quickly */
  }
  .wrap{
    width:100%;
    max-width:680px;
    flex:1;
    min-height:0;   /* fills what the top bar leaves */
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header.top{width:100%; text-align:center; margin-bottom:24px; flex-shrink:0;}
  header.top h1{
    font-size:clamp(30px, 6vw, 46px);
    margin:0 0 6px;
    font-weight:900;
    letter-spacing:-0.5px;
  }
  header.top h1 span{
    background:var(--pink);
    padding:2px 10px;
    border:3px solid var(--ink);
    border-radius:10px;
    box-shadow:var(--shadow-off) var(--shadow-off) 0 var(--ink);
    display:inline-block;
    transform:rotate(-2deg);
  }
  header.top p{margin:10px 0 0; font-size:16px; color:#444; font-weight:500;}

  /* ---------- the flip card ---------- */
  .stage{
    width:100%;
    flex:1;
    min-height:0;
    position:relative;
  }
  /* The button is absolutely positioned and only holds the perspective; the inner div
     does the 3D turn, which Safari won't do on a button. Sizing comes from fixed insets
     plus max-height - no height percentages anywhere: mobile engines that mis-resolve
     a % height in min()/calc() were collapsing the card to a strip. */
  .flip{
    -webkit-appearance:none;
    appearance:none;
    border:0;
    padding:0;
    background:none;
    font:inherit;
    color:inherit;
    position:absolute;
    left:0;
    top:0;
    bottom:8px;            /* room for the hard shadow */
    width:calc(100% - 8px);
    max-height:460px;
    margin:auto 0;
    cursor:pointer;
    perspective:1400px;
    -webkit-perspective:1400px;
  }
  .inner{
    position:absolute;
    inset:0;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.3, 1.4, .5, 1);
  }
  .flip.flipped .inner{transform:rotateY(180deg);}
  .flip.instant .inner, .flip.instant .face{transition:none;}
  /* Backup for browsers that ignore backface-visibility: swap faces as the card passes edge-on
     (the easing reaches 90° at 75ms of the 600ms turn, in both directions) */
  .face{transition:visibility 0s linear 75ms;}
  .back, .flip.flipped .front{visibility:hidden;}
  .flip.flipped .back{visibility:visible;}
  .flip.pop{animation:pop .3s ease;}
  @keyframes pop{
    from{opacity:0; transform:translateY(10px) scale(.97);}
    to{opacity:1; transform:none;}
  }
  .face{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:clamp(24px, 5vw, 44px);
    text-align:center;
    border:3px solid var(--ink);
    border-radius:22px;
    box-shadow:8px 8px 0 var(--ink);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .front{background:var(--card); transform:rotateY(0deg);}   /* its own 3D layer, so Safari hides it when turned away */
  .back{background:var(--yellow); transform:rotateY(180deg);}
  @media (hover:hover){ .flip:hover .face{box-shadow:10px 10px 0 var(--ink);} }
  .flip:focus-visible{outline:none;}
  .flip:focus-visible .face{outline:3px dashed var(--ink); outline-offset:6px;}

  .tag{
    background:var(--yellow);
    border:2.5px solid var(--ink);
    border-radius:8px;
    padding:4px 12px;
    font-weight:800;
    font-size:13px;
    box-shadow:3px 3px 0 var(--ink);
  }
  .back .tag{background:var(--pink);}
  .emoji{font-size:clamp(44px, 9vh, 64px); line-height:1;}
  .line{
    margin:0;
    font-size:clamp(22px, 4.6vw, 32px);
    font-weight:800;
    line-height:1.25;
    text-wrap:balance;
  }
  .back .line{font-size:clamp(24px, 5.2vw, 38px); font-weight:900;}
  .hint{
    font-size:14px;
    font-weight:800;
    color:#777;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .back .hint{color:#5a4a00;}
  .front .hint::before{content:"👆";}

  /* ---------- big arrows ---------- */
  .controls{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-top:22px;
    flex-shrink:0;
  }
  .arrow{
    appearance:none;
    width:clamp(76px, 18vw, 104px);
    height:clamp(76px, 18vw, 104px);
    border:3px solid var(--ink);
    border-radius:50%;
    background:var(--neutral-btn);
    color:var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .arrow svg{width:46%; height:46%;}
  @media (hover:hover){
    .arrow:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--ink); background:var(--pink);}
    .arrow.next:hover{background:var(--green);}
  }
  .arrow:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .arrow:focus-visible{outline:3px dashed var(--ink); outline-offset:5px;}
  .middle{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .play{
    appearance:none;
    width:clamp(60px, 14vw, 78px);
    height:clamp(60px, 14vw, 78px);
    border:3px solid var(--ink);
    border-radius:50%;
    background:var(--yellow);
    color:var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    cursor:pointer;
    display:grid;
    place-items:center;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .play svg{width:44%; height:44%;}
  .play .stop-icon, .play.playing .play-icon{display:none;}
  .play.playing .stop-icon{display:block;}
  .play.playing{background:var(--pink);}
  .play.waiting{animation:wait 1s ease-in-out infinite;}
  @keyframes wait{50%{transform:scale(1.08);}}
  @media (hover:hover){ .play:hover{transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--ink);} }
  .play:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .play:focus-visible{outline:3px dashed var(--ink); outline-offset:5px;}
  .play.no-voice{visibility:hidden;}   /* keeps its spot so the arrows don't shift */
  .counter{font-size:15px; font-weight:800; color:#777; text-align:center;}
  .counter b{color:var(--ink); font-size:20px;}

  /* Top-left bar: projects menu first, then the way home */
  .page-nav{
    align-self:stretch;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:12px;
  }
  .site-link{
    font-size:14px;
    font-weight:800;
    color:#777;
    text-decoration:none;
  }
  .site-link:hover{color:var(--ink);}

  @media (max-height:640px){
    header.top p{display:none;}
    .emoji{display:none;}
  }
  /* Phones on their side: arrows flank the card instead of taking a row under it */
  @media (max-height:520px) and (orientation:landscape){
    body{padding:10px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));}
    .wrap{
      max-width:960px;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      grid-template-rows:auto minmax(0,1fr) auto auto;
      column-gap:20px;
      align-items:center;
    }
    header.top{grid-column:1 / -1; margin-bottom:8px;}
    header.top h1{font-size:26px;}
    header.top h1 span{border-width:2.5px; box-shadow:3px 3px 0 var(--ink);}
    .controls{display:contents;}
    #prev{grid-column:1; grid-row:2;}
    .stage{grid-column:2; grid-row:2; height:100%;}
    #next{grid-column:3; grid-row:2;}
    .arrow{width:68px; height:68px; box-shadow:4px 4px 0 var(--ink);}
    .middle{grid-column:1 / -1; grid-row:3; flex-direction:row; justify-content:center; gap:16px; margin-top:6px;}
    .play{width:48px; height:48px; box-shadow:3px 3px 0 var(--ink);}
    .page-nav{margin-bottom:4px;}
    .site-link{font-size:13px;}
    .face{gap:10px; padding:14px 22px; box-shadow:6px 6px 0 var(--ink);}
    .line{font-size:22px;}
    .back .line{font-size:26px;}
  }
  @media (prefers-reduced-motion: reduce){
    .inner, .face{transition:none;}
    .flip.pop{animation:none;}
    .play.waiting{animation:none;}
  }
</style>
</head>
<body>
<nav class="page-nav">
  <button type="button" data-projects-menu aria-label="Projects"></button>
  <a class="site-link" href="/">&larr; Back to scott-dickie.com</a>
</nav>
<div class="wrap">
  <header class="top">
    <h1>Joke <span>Flip!</span></h1>
    <p>Dad jokes for kids</p>
  </header>

  <div class="stage">
    <button class="flip" id="card" type="button" aria-label="Flip the card to see the punchline">
     <div class="inner">
      <div class="face front">
        <span class="tag" id="tagFront">JOKE 1</span>
        <div class="emoji" id="emoji" aria-hidden="true"></div>
        <p class="line" id="setup"></p>
        <span class="hint">Tap to flip</span>
      </div>
      <div class="face back" aria-hidden="true">
        <span class="tag">PUNCHLINE</span>
        <p class="line" id="punch" aria-live="polite"></p>
        <span class="hint">Tap to flip back</span>
      </div>
     </div>
    </button>
  </div>

  <div class="controls">
    <button class="arrow prev" id="prev" type="button" aria-label="Previous joke">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>
    </button>
    <div class="middle">
      <button class="play" id="play" type="button" aria-label="Read the jokes out loud">
        <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
        <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
      </button>
      <div class="counter" id="counter" aria-live="polite"></div>
    </div>
    <button class="arrow next" id="next" type="button" aria-label="Next joke">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </button>
  </div>

</div>

<script>
const JOKES = [
  ["🏃", "I used to be scared of hurdles.", "Then I got over it."],
  ["🐶", "My dog can do math. I asked him what 10 minus 10 is.", "He said nothing."],
  ["🌫️", "I tried to catch fog yesterday.", "Mist."],
  ["📖", "I'm reading a book about anti-gravity.", "I can't put it down."],
  ["🤔", "My teacher said I'd never be good at making decisions.", "I'm not sure about that."],
  ["😂", "I told my friend 10 jokes to make him laugh.", "Sadly, no pun in ten did."],
  ["🐢", "I asked the librarian for a book about turtles. She said, \"Hardback?\"", "I said, \"Yeah, and a little head.\""],
  ["🤧", "Seven dwarves walk into the nurse's office. \"Who needs help?\"", "Doc says, \"Sneezy, but Bashful won't say it.\""],
  ["🏦", "I lost my job at the bank on my first day. A lady asked me to check her balance…", "…so I pushed her."],
  ["🐴", "Quick question: do you think you're a horse? Yay or nay?", "Nay?! That's exactly what a horse would say."],
  ["🥁", "My little brother asked me how to spell \"rhythm.\"", "I said, \"There's no rhyme or reason to it.\""],
  ["🛗", "I'm terrified of elevators.", "So I'm taking steps to avoid them."],
  ["🚗", "Why did Harry Potter fail his driving test?", "He kept trying to park on Platform 9¾."],
  ["🐌", "I took the shell off my pet snail to help him go faster.", "If anything, he looks more sluggish."],
  ["🦈", "A shark can swim faster than me.", "But I can walk out of the pool, so who's really winning?"],
  ["🥖", "I wanted to be a baker…", "…but I couldn't make enough dough."],
  ["🍞", "My friend's bakery burned down.", "Now his business is toast."],
  ["✏️", "I tried to write with a broken pencil.", "It was pointless."],
  ["🥤", "I got hit in the head with a can of soda.", "Luckily it was a soft drink."],
  ["🪜", "I don't trust stairs.", "They're always up to something."],
  ["📚", "Why did the math book look sad?", "It had too many problems."],
  ["🐱", "My cat was sitting on my computer.", "He wanted to keep an eye on the mouse."],
  ["🏠", "I told a joke about a roof.", "It went over everyone's head."],
  ["🔤", "I'm friends with 25 letters of the alphabet.", "I don't know Y."],
  ["🌾", "Why did the scarecrow win an award?", "He was outstanding in his field."],
  ["🧳", "I tried to sue the airport for losing my luggage.", "I lost my case."],
  ["💀", "A skeleton tried out for the soccer team.", "He didn't have the guts."],
  ["⚛️", "Why can't you trust atoms?", "They make up everything."],
  ["🚙", "I couldn't figure out how my seatbelt worked.", "Then it just clicked."],
  ["👩‍🏫", "My teacher asked me to name two pronouns.", "I said, \"Who, me?\""],
  ["🚲", "Why couldn't the bike stand up on its own?", "It was two-tired."],
  ["⏰", "I ate a clock yesterday.", "It was very time-consuming."],
  ["🧔", "Seven dwarves went to the doctor.", "He said they had to stop being Grumpy, because it was making him Sneezy."],
  ["🧊", "Quick question: is your refrigerator running?", "Better go catch it!"],
  ["🦕", "What do you call a dinosaur that's sleeping?", "A dino-snore."]
];

const card = document.getElementById('card');
const back = card.querySelector('.back');
const els = {
  tag: document.getElementById('tagFront'),
  emoji: document.getElementById('emoji'),
  setup: document.getElementById('setup'),
  punch: document.getElementById('punch'),
  counter: document.getElementById('counter')
};

// Start where the link says (#7 opens joke 7), otherwise at the first joke
let index = Math.min(Math.max((parseInt(location.hash.slice(1), 10) || 1) - 1, 0), JOKES.length - 1);
let flipped = false;

function setFlipped(next){
  flipped = next;
  card.classList.toggle('flipped', flipped);
  back.setAttribute('aria-hidden', String(!flipped));
  card.setAttribute('aria-label', flipped ? 'Flip the card back to the setup' : 'Flip the card to see the punchline');
}

// ---------- read-aloud: setup, a 3 second pause, then flip and say the punchline ----------
// Clips are pre-made by make-audio.py (jokes/audio/N-setup.mp3, N-punch.mp3).
// One <audio> element is reused so iOS lets the punchline play after the pause.
const playBtn = document.getElementById('play');
const voice = new Audio();
const PAUSE_MS = 3000;   // setup -> punchline
const NEXT_MS = 3000;    // punchline -> next joke
const VOICED = new Set(JOKES.map((_, i) => i + 1));   // joke numbers that have saved clips in audio/ (all of them)
let run = 0, pauseTimer = null;

function setPlaying(on){
  playBtn.classList.toggle('playing', on);
  if (!on) playBtn.classList.remove('waiting');
  playBtn.setAttribute('aria-label', on ? 'Stop reading' : 'Read the jokes out loud');
}

function stopVoice(){
  run++;
  clearTimeout(pauseTimer);
  voice.pause();
  voice.onended = voice.onerror = null;
  setPlaying(false);
}

function say(src, id){
  return new Promise((resolve, reject) => {
    voice.onended = () => resolve();
    voice.onerror = () => reject(new Error('missing clip ' + src));
    voice.src = src;
    voice.play().catch(reject);
  }).then(() => { if (id !== run) throw 'stopped'; });
}

function pause(ms, id){
  return new Promise(r => { pauseTimer = setTimeout(r, ms); })
    .then(() => { if (id !== run) throw 'stopped'; });
}

// One press reads this joke, then keeps going joke by joke until the last one
async function readJoke(){
  const id = ++run;
  clearTimeout(pauseTimer);
  setPlaying(true);
  try {
    for (;;) {
      const n = index + 1;
      if (flipped) setFlipped(false);
      await say('/jokes/audio/' + n + '-setup.mp3', id);
      playBtn.classList.add('waiting');
      await pause(PAUSE_MS, id);
      playBtn.classList.remove('waiting');
      setFlipped(true);
      await say('/jokes/audio/' + n + '-punch.mp3', id);
      if (index === JOKES.length - 1 || !VOICED.has(index + 2)) break;
      await pause(NEXT_MS, id);
      show(index + 1, true);
    }
  } catch (e) {
    if (id === run && e !== 'stopped') console.warn(e);
  }
  if (id === run) setPlaying(false);
}

const isPlaying = () => playBtn.classList.contains('playing');
playBtn.addEventListener('click', () => isPlaying() ? stopVoice() : readJoke());

// Arrows, keys and swipes: while reading, skip to that joke and keep reading
function go(delta){
  const wasPlaying = isPlaying();
  show(index + delta);
  if (wasPlaying && VOICED.has(index + 1)) readJoke();
}

function show(i, keepReading){
  if (!keepReading) stopVoice();
  index = (i + JOKES.length) % JOKES.length;
  const voiced = VOICED.has(index + 1);
  playBtn.classList.toggle('no-voice', !voiced);
  playBtn.disabled = !voiced;
  // Turn the card back to its front with no animation first, so the next punchline never shows mid-flip
  card.classList.add('instant');
  setFlipped(false);
  const [emoji, setup, punch] = JOKES[index];
  els.tag.textContent = 'JOKE ' + (index + 1);
  els.emoji.textContent = emoji;
  els.setup.textContent = setup;
  els.punch.textContent = punch;
  els.counter.innerHTML = '<b>' + (index + 1) + '</b> / ' + JOKES.length;
  history.replaceState(null, '', '#' + (index + 1));
  card.classList.remove('pop');
  void card.offsetWidth;
  card.classList.remove('instant');
  card.classList.add('pop');
}

card.addEventListener('animationend', () => card.classList.remove('pop'));
card.addEventListener('click', () => { stopVoice(); setFlipped(!flipped); });
document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));

// Keyboard: arrows to move, space or enter flips (the card button handles those when focused)
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === document.body) { e.preventDefault(); setFlipped(!flipped); }
});

// Swipe left or right on a phone to change jokes
let startX = null, startY = null;
card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
card.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX, dy = e.changedTouches[0].clientY - startY;
  startX = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    e.preventDefault();   // a swipe is not also a tap-to-flip
    go(dx < 0 ? 1 : -1);
  }
});

show(index);
</script>
<script src="../projects-menu.js"></script>
</body>
</html>
