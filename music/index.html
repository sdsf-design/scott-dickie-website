<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music | Scott Dickie</title>
  <meta name="description" content="Songs written and recorded by Scott Dickie." />
  <link rel="icon" href="../assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* Dark theme for this page, built on the site's tokens */
    :root {
      --bg: #262626;
      --card-bg: #211f1d;
      --text-primary: #f3efe8;
      --text-secondary: #b3aea6;
      --accent: #7aa7ff;
      --border: rgba(243, 239, 232, 0.1);
      --record-size: min(78vw, 420px, 44vh, 44svh);
      color-scheme: dark;
    }

    /* Let the record's shadow show through instead of being clipped by a sticky header */
    .site-header {
      position: relative;
      z-index: 1;
      background: transparent;
      backdrop-filter: none;
    }

    /* Just the name, centred at the top */
    .site-header .wrap {
      justify-content: center;
    }

    .page-name {
      font-size: 14px;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Fill the screen so the song list can sit near the bottom without scrolling */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .music {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 0 28px;
    }

    .music {
      overflow-x: clip;
    }

    .music .wrap {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Record */
    .record {
      position: relative;
      isolation: isolate;
      width: var(--record-size);
      aspect-ratio: 1;
    }

    /* The waveform continues across the page behind the record, frosted like it's behind glass */
    .backdrop {
      position: absolute;
      top: -40%;
      left: 50%;
      z-index: -1;
      width: 100vw;
      height: 180%;
      transform: translateX(-50%);
      filter: blur(5px);
      opacity: 0.85;
      pointer-events: none;
    }

    .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from 30deg, transparent 0deg, rgba(255, 255, 255, 0.05) 40deg, transparent 80deg, transparent 200deg, rgba(255, 255, 255, 0.04) 230deg, transparent 260deg),
        repeating-radial-gradient(circle, #0d0c0c 0 2px, #141312 2px 3px),
        #0d0c0c;
      box-shadow:
        0 0 0 1px rgba(243, 239, 232, 0.06),
        0 30px 60px rgba(0, 0, 0, 0.55);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
    }

    .disc::after {
      /* label ring */
      content: "";
      position: absolute;
      inset: 27%;
      border-radius: 50%;
      background: #1c1a19;
      box-shadow: 0 0 0 1px rgba(243, 239, 232, 0.08);
    }

    .record.is-playing .disc {
      animation-play-state: running;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .disc {
        animation: none;
      }
    }

    .visualizer {
      position: absolute;
      inset: 27%;
      width: 46%;
      height: 46%;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Controls */
    .controls {
      width: 100%;
      margin-top: 40px;
      text-align: center;
    }

    .controls h2 {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text-primary);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      background: var(--text-primary);
      color: var(--bg);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .play-btn:hover {
      background: #fff;
      color: var(--bg);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .icon-btn svg[hidden] {
      display: none;
    }

    .icon-btn:focus-visible,
    .track:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .player-error {
      font-size: 14px;
      color: #ff8a80;
      margin: 12px 0 0;
    }

    /* One line of songs; scrolls sideways on narrow screens */
    .tracklist {
      width: 100%;
      list-style: none;
      margin: auto 0 0;
      padding: 28px 0 4px;
      display: flex;
      gap: 28px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tracklist::-webkit-scrollbar {
      display: none;
    }

    /* Auto margins centre the line when it fits without hiding the start when it doesn't */
    .tracklist li:first-child {
      margin-left: auto;
    }

    .tracklist li:last-child {
      margin-right: auto;
    }

    .track {
      padding: 4px 0;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 22px;
      white-space: nowrap;
      color: #5f5b57;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .track:hover,
    .track[aria-current="true"] {
      color: #a8a39d;
    }

    @media (max-width: 720px) {
      .music {
        padding: 24px 0 24px;
      }

      .controls {
        margin-top: 32px;
      }

      .tracklist {
        gap: 22px;
        margin-left: calc(-1 * var(--wrap-pad));
        margin-right: calc(-1 * var(--wrap-pad));
        padding: 24px var(--wrap-pad) 4px;
      }

      .track {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="page-name" href="../index.html">Scott Dickie</a>
    </div>
  </header>

  <main>
    <section class="music">
      <h1 class="visually-hidden">Music</h1>
      <div class="wrap">
        <div class="record" id="record">
          <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
          <div class="disc"></div>
          <canvas class="visualizer" id="visualizer" aria-hidden="true"></canvas>
        </div>

        <div class="controls">
          <h2 id="song-title"></h2>

          <div class="buttons">
            <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
            </button>
            <button class="icon-btn play-btn" id="play-btn" type="button" aria-label="Play">
              <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
            </button>
            <button class="icon-btn" id="next-btn" type="button" aria-label="Next song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
            </button>
          </div>

          <p class="player-error" id="player-error" hidden>This song couldn&rsquo;t be loaded.</p>
        </div>

        <ol class="tracklist" id="tracklist"></ol>

        <audio id="audio" preload="metadata"></audio>
      </div>
    </section>
  </main>

  <script>
    // Add songs here. Put audio files in music/audio/.
    const songs = [
      {
        title: "Calm Chaos",
        src: "/music/audio/calm-chaos.m4a"
      },
      {
        title: "Become",
        src: "/music/audio/become.m4a"
      },
      {
        title: "I'm Walking Away",
        src: "/music/audio/im-walking-away.m4a"
      },
      {
        title: "Rise",
        src: "/music/audio/rise.m4a"
      },
      {
        title: "Monday Morning",
        src: "/music/audio/monday-morning.m4a"
      }
    ];

    const audio = document.getElementById("audio");
    const record = document.getElementById("record");
    const canvas = document.getElementById("visualizer");
    const backdrop = document.getElementById("backdrop");
    const playBtn = document.getElementById("play-btn");
    const iconPlay = document.getElementById("icon-play");
    const iconPause = document.getElementById("icon-pause");
    const titleEl = document.getElementById("song-title");
    const errorEl = document.getElementById("player-error");
    const tracklist = document.getElementById("tracklist");

    let current = 0;

    function setPlayingUI(playing) {
      iconPlay.toggleAttribute("hidden", playing);
      iconPause.toggleAttribute("hidden", !playing);
      playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
      record.classList.toggle("is-playing", playing);
    }

    function loadSong(index, autoplay) {
      current = index;
      const song = songs[index];
      titleEl.textContent = song.title;
      errorEl.hidden = true;
      audio.src = song.src;
      tracklist.querySelectorAll(".track").forEach((btn, i) => {
        btn.setAttribute("aria-current", i === index ? "true" : "false");
      });
      if (autoplay) {
        play();
      } else {
        setPlayingUI(false);
      }
    }

    function play() {
      startAnalyser();
      audio.play().catch(() => {});
    }

    function togglePlay() {
      if (audio.paused) {
        play();
      } else {
        audio.pause();
      }
    }

    songs.forEach((song, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "track";
      btn.textContent = song.title;
      btn.addEventListener("click", () => {
        if (i === current && audio.src) {
          togglePlay();
        } else {
          loadSong(i, true);
        }
      });
      li.appendChild(btn);
      tracklist.appendChild(li);
    });

    playBtn.addEventListener("click", togglePlay);
    document.getElementById("prev-btn").addEventListener("click", () => {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadSong((current - 1 + songs.length) % songs.length, !audio.paused);
      }
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      loadSong((current + 1) % songs.length, !audio.paused);
    });

    audio.addEventListener("play", () => {
      setPlayingUI(true);
      drawLoop();
    });
    audio.addEventListener("pause", () => {
      setPlayingUI(false);
      drawLoop();
    });
    audio.addEventListener("ended", () => {
      if (current < songs.length - 1) {
        loadSong(current + 1, true);
      } else {
        setPlayingUI(false);
      }
    });
    audio.addEventListener("error", () => {
      errorEl.hidden = false;
      setPlayingUI(false);
    });

    // Siri-style wave driven by the live audio as it plays: crisp inside the label, and a larger
    // copy blurred across the page behind the record.
    const ctx = canvas.getContext("2d");
    const bgCtx = backdrop.getContext("2d");
    // Fixed loudness scale so every part of every song is drawn the same way
    const FLOOR = 0.04;
    const CEILING = 0.48;
    const AUDIO_DELAY = 0.05; // seconds the sound is held back behind the wave
    let analyser = null;
    let samples = null;
    let slowLevel = 0;
    let drawing = false;

    function startAnalyser() {
      if (analyser) {
        if (analyser.context.state === "suspended") analyser.context.resume();
        return;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audioCtx = new AudioCtx({ latencyHint: "interactive" });
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512; // ~10ms of audio, so the wave reacts to what's playing right now
      // The wave reads the audio a moment before you hear it, so drawing and easing never trail the beat
      const delay = audioCtx.createDelay(1);
      delay.delayTime.value = AUDIO_DELAY;
      source.connect(analyser);
      source.connect(delay);
      delay.connect(audioCtx.destination);
      samples = new Float32Array(analyser.fftSize);
    }

    function currentLevel() {
      if (!analyser || audio.paused) return 0;
      analyser.getFloatTimeDomainData(samples);
      let sum = 0;
      for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
      const rms = Math.sqrt(sum / samples.length);
      const v = Math.min(1, Math.max(0, (rms - FLOOR) / (CEILING - FLOOR)));
      const loud = Math.pow(v, 1.6); // widen the gap between hits and quiet moments
      // Boost sudden jumps above the recent average so drum hits punch out of the wave
      slowLevel += (loud - slowLevel) * 0.08;
      const hit = Math.max(0, loud - slowLevel);
      return Math.min(1.25, loud * 0.75 + hit * 2.4);
    }

    function sizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      for (const [el, c] of [[canvas, ctx], [backdrop, bgCtx]]) {
        el.width = Math.round(el.clientWidth * dpr);
        el.height = Math.round(el.clientHeight * dpr);
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      draw();
    }

    // A few thin tapered sine lines, white fading to grey. Each line has its own frequency, speed
    // and slow "breathing" so they weave around each other rather than moving in lockstep.
    const SIRI_LINES = [
      { attenuation: -2, alpha: 0.1, width: 1, freq: 1.3, speed: 0.7, offset: 0.0 },
      { attenuation: -6, alpha: 0.2, width: 1, freq: 1.9, speed: 1.3, offset: 1.1 },
      { attenuation: 4, alpha: 0.35, width: 1, freq: 1.5, speed: 0.9, offset: 2.3 },
      { attenuation: 2, alpha: 0.6, width: 1, freq: 1.7, speed: 1.15, offset: 3.4 },
      { attenuation: 1, alpha: 0.95, width: 1.5, freq: 1.6, speed: 1, offset: 0.6 }
    ];
    // Spring easing: snaps up on a hit, then falls back with a soft bounce
    const RISE = { stiffness: 2200, damping: 75 };
    const FALL = { stiffness: 320, damping: 20 };
    let siriAmp = 0;
    let siriVel = 0;
    let siriPhase = 0;
    let lastFrame = 0;

    function drawSiri(c, width, height, maxHeight, lineScale, clipRadius, t) {
      if (width < 8 || height < 8) return; // not laid out yet
      const cy = height / 2;
      c.clearRect(0, 0, width, height);
      c.save();
      if (clipRadius) {
        c.beginPath();
        c.arc(width / 2, cy, clipRadius, 0, Math.PI * 2);
        c.clip();
      }
      const stepX = Math.max(1, width / 400);
      for (const line of SIRI_LINES) {
        const breath = 0.8 + 0.2 * Math.sin(t * 1.7 + line.offset);
        const amp = (siriAmp * maxHeight * breath) / line.attenuation;
        const phase = siriPhase * line.speed + line.offset;
        c.beginPath();
        for (let x = 0; x <= width + stepX; x += stepX) {
          const u = (x / width) * 4 - 2; // -2..2 across the wave
          const taper = Math.pow(4 / (4 + Math.pow(u, 4)), 4);
          const y = cy + amp * taper * Math.sin(line.freq * Math.PI * u - phase);
          if (x === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        // Lines brighten on hits
        c.strokeStyle = `rgba(235, 235, 235, ${Math.min(1, line.alpha * (0.75 + siriAmp * 0.6))})`;
        c.lineWidth = line.width * lineScale;
        c.stroke();
      }
      c.restore();
    }

    function draw(now = performance.now()) {
      const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
      lastFrame = now;
      const target = currentLevel();
      // Step the spring in small fixed slices so it stays stable even at low frame rates
      const steps = Math.ceil(dt / 0.004);
      const h = steps ? dt / steps : 0;
      for (let i = 0; i < steps; i++) {
        const spring = target > siriAmp ? RISE : FALL;
        siriVel += ((target - siriAmp) * spring.stiffness - siriVel * spring.damping) * h;
        siriAmp = Math.min(1.3, Math.max(0, siriAmp + siriVel * h));
      }
      siriPhase += dt * (5 + siriAmp * 24);

      const t = now / 1000;
      const size = canvas.clientWidth;
      drawSiri(ctx, size, size, size * 0.4, 1, size / 2 - 4, t);

      // The same wave scaled up to span the page, kept inside the backdrop's height
      const bgWidth = backdrop.clientWidth;
      const bgHeight = backdrop.clientHeight;
      const scale = bgWidth / size;
      drawSiri(bgCtx, bgWidth, bgHeight, Math.min(size * 0.4 * scale, bgHeight * 0.48), Math.min(4, scale), 0, t);
    }

    function drawLoop() {
      if (drawing) return;
      drawing = true;
      lastFrame = 0;
      const tick = (now) => {
        draw(now);
        // Keep animating after a pause until the wave has eased back to flat
        if (!audio.paused || siriAmp > 0.003 || Math.abs(siriVel) > 0.01) {
          requestAnimationFrame(tick);
        } else {
          drawing = false;
        }
      };
      requestAnimationFrame(tick);
    }

    loadSong(0, false);
    window.addEventListener("resize", sizeCanvas);
    sizeCanvas();
  </script>
</body>
</html>
