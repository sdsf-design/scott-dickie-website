<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music | Scott Dickie</title>
  <meta name="description" content="Songs written and recorded by Scott Dickie." />
  <link rel="icon" href="../assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    /* Dark theme for this page, built on the site's tokens */
    :root {
      --bg: #161514;
      --card-bg: #211f1d;
      --text-primary: #f3efe8;
      --text-secondary: #b3aea6;
      --accent: #7aa7ff;
      --border: rgba(243, 239, 232, 0.1);
      --record-size: min(78vw, 420px);
      color-scheme: dark;
    }

    .site-header {
      background: rgba(22, 21, 20, 0.9);
    }

    .btn-primary:hover {
      background: #fff;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .music {
      padding: 48px 0 96px;
    }

    .music .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Record */
    .record {
      position: relative;
      width: var(--record-size);
      aspect-ratio: 1;
    }

    .disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        conic-gradient(from 30deg, transparent 0deg, rgba(255, 255, 255, 0.05) 40deg, transparent 80deg, transparent 200deg, rgba(255, 255, 255, 0.04) 230deg, transparent 260deg),
        repeating-radial-gradient(circle, #0d0c0c 0 2px, #141312 2px 3px),
        #0d0c0c;
      box-shadow:
        0 0 0 1px rgba(243, 239, 232, 0.06),
        0 30px 60px rgba(0, 0, 0, 0.55);
      animation: spin 12s linear infinite;
      animation-play-state: paused;
    }

    .disc::after {
      /* label ring */
      content: "";
      position: absolute;
      inset: 27%;
      border-radius: 50%;
      background: #1c1a19;
      box-shadow: 0 0 0 1px rgba(243, 239, 232, 0.08);
    }

    .record.is-playing .disc {
      animation-play-state: running;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .disc {
        animation: none;
      }
    }

    .visualizer {
      position: absolute;
      inset: 27%;
      width: 46%;
      height: 46%;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Controls */
    .controls {
      width: min(100%, 360px);
      margin-top: 40px;
      text-align: center;
    }

    .controls h2 {
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--text-primary);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .play-btn {
      width: 52px;
      height: 52px;
      background: var(--text-primary);
      color: var(--bg);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .play-btn:hover {
      background: #fff;
      color: var(--bg);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .icon-btn svg[hidden] {
      display: none;
    }

    .icon-btn:focus-visible,
    .track:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .player-error {
      font-size: 14px;
      color: #ff8a80;
      margin: 12px 0 0;
    }

    .tracklist {
      list-style: none;
      margin: 28px 0 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px 6px;
    }

    .track {
      padding: 4px 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font: inherit;
      font-size: 14px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .track:hover {
      color: var(--text-primary);
    }

    .track[aria-current="true"] {
      color: var(--text-primary);
      background: var(--card-bg);
    }

    @media (max-width: 720px) {
      .music {
        padding: 24px 0 72px;
      }

      .controls {
        margin-top: 32px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../index.html">
        <img src="../assets/profile.jpg" alt="Scott Dickie" />
        Scott Dickie
      </a>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="../leadership.html">Leadership</a>
        <a class="btn btn-primary" href="https://www.linkedin.com/in/scottdickie" target="_blank" rel="noopener">Linkedin</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="music">
      <h1 class="visually-hidden">Music</h1>
      <div class="wrap">
        <div class="record" id="record">
          <div class="disc"></div>
          <canvas class="visualizer" id="visualizer" aria-hidden="true"></canvas>
        </div>

        <div class="controls">
          <h2 id="song-title"></h2>

          <div class="buttons">
            <button class="icon-btn" id="prev-btn" type="button" aria-label="Previous song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
            </button>
            <button class="icon-btn play-btn" id="play-btn" type="button" aria-label="Play">
              <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
            </button>
            <button class="icon-btn" id="next-btn" type="button" aria-label="Next song">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
            </button>
          </div>

          <p class="player-error" id="player-error" hidden>This song couldn&rsquo;t be loaded.</p>

          <ol class="tracklist" id="tracklist"></ol>
        </div>

        <audio id="audio" preload="metadata"></audio>
      </div>
    </section>
  </main>

  <script>
    // Add songs here. Put audio files in music/audio/.
    const songs = [
      {
        title: "Calm Chaos",
        src: "/music/audio/calm-chaos.m4a"
      },
      {
        title: "Become",
        src: "/music/audio/become.m4a"
      },
      {
        title: "I'm Walking Away",
        src: "/music/audio/im-walking-away.m4a"
      },
      {
        title: "Rise",
        src: "/music/audio/rise.m4a"
      },
      {
        title: "Monday Morning",
        src: "/music/audio/monday-morning.m4a"
      }
    ];

    const audio = document.getElementById("audio");
    const record = document.getElementById("record");
    const canvas = document.getElementById("visualizer");
    const playBtn = document.getElementById("play-btn");
    const iconPlay = document.getElementById("icon-play");
    const iconPause = document.getElementById("icon-pause");
    const titleEl = document.getElementById("song-title");
    const errorEl = document.getElementById("player-error");
    const tracklist = document.getElementById("tracklist");

    let current = 0;

    function setPlayingUI(playing) {
      iconPlay.toggleAttribute("hidden", playing);
      iconPause.toggleAttribute("hidden", !playing);
      playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
      record.classList.toggle("is-playing", playing);
    }

    function loadSong(index, autoplay) {
      current = index;
      const song = songs[index];
      titleEl.textContent = song.title;
      errorEl.hidden = true;
      audio.src = song.src;
      tracklist.querySelectorAll(".track").forEach((btn, i) => {
        btn.setAttribute("aria-current", i === index ? "true" : "false");
      });
      if (autoplay) {
        play();
      } else {
        setPlayingUI(false);
      }
    }

    function play() {
      startVisualizer();
      audio.play().catch(() => {});
    }

    function togglePlay() {
      if (audio.paused) {
        play();
      } else {
        audio.pause();
      }
    }

    songs.forEach((song, i) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "track";
      btn.textContent = song.title;
      btn.addEventListener("click", () => {
        if (i === current && audio.src) {
          togglePlay();
        } else {
          loadSong(i, true);
        }
      });
      li.appendChild(btn);
      tracklist.appendChild(li);
    });

    playBtn.addEventListener("click", togglePlay);
    document.getElementById("prev-btn").addEventListener("click", () => {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadSong((current - 1 + songs.length) % songs.length, !audio.paused);
      }
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      loadSong((current + 1) % songs.length, !audio.paused);
    });

    audio.addEventListener("play", () => {
      setPlayingUI(true);
      drawLoop();
    });
    audio.addEventListener("pause", () => setPlayingUI(false));
    audio.addEventListener("ended", () => {
      if (current < songs.length - 1) {
        loadSong(current + 1, true);
      } else {
        setPlayingUI(false);
      }
    });
    audio.addEventListener("error", () => {
      errorEl.hidden = false;
      setPlayingUI(false);
    });

    // Pixel wave visualizer drawn inside the record label
    const ctx = canvas.getContext("2d");
    const CELL = 3; // css px per pixel block, including gap
    const GAP = 1;
    let analyser = null;
    let freq = null;
    let levels = [];
    let drawing = false;

    function startVisualizer() {
      if (analyser) {
        if (analyser.context.state === "suspended") analyser.context.resume();
        return;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audioCtx = new AudioCtx();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.82;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      freq = new Uint8Array(analyser.frequencyBinCount);
    }

    function sizeCanvas() {
      const size = canvas.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function draw() {
      const size = canvas.clientWidth;
      const cols = Math.floor(size / CELL);
      const half = Math.floor(cols / 2);
      const offset = Math.floor((size - cols * CELL) / 2);
      const radius = size / 2 - CELL * 0.6;
      const center = size / 2;
      if (levels.length !== cols) levels = new Array(cols).fill(0);

      if (analyser && !audio.paused) {
        analyser.getByteFrequencyData(freq);
      }

      ctx.clearRect(0, 0, size, size);
      let active = false;

      for (let c = 0; c < cols; c++) {
        // Mirror the spectrum around the middle column, low frequencies in the centre
        const fromMid = Math.abs(c - (cols - 1) / 2) / (cols / 2);
        let target = 0;
        if (analyser && !audio.paused) {
          const bin = Math.floor(Math.pow(fromMid, 1.4) * freq.length * 0.7);
          target = freq[bin] / 255;
        }
        levels[c] += (target - levels[c]) * (target > levels[c] ? 0.5 : 0.12);
        if (levels[c] > 0.01) active = true;

        const h = Math.round(levels[c] * half);
        const x = offset + c * CELL;
        for (let r = -h; r <= h; r++) {
          const y = offset + (half + r) * CELL;
          const dx = x + CELL / 2 - center;
          const dy = y + CELL / 2 - center;
          if (dx * dx + dy * dy > radius * radius) continue;
          const edge = Math.abs(r) === h && h > 0;
          ctx.fillStyle = edge
            ? "rgba(122, 167, 255, 0.55)"
            : `rgba(243, 239, 232, ${0.5 - (Math.abs(r) / (half + 1)) * 0.38})`;
          ctx.fillRect(x, y, CELL - GAP, CELL - GAP);
        }
      }
      return active;
    }

    function drawLoop() {
      if (drawing) return;
      drawing = true;
      const tick = () => {
        const active = draw();
        if (!audio.paused || active) {
          requestAnimationFrame(tick);
        } else {
          drawing = false;
        }
      };
      requestAnimationFrame(tick);
    }

    window.addEventListener("resize", sizeCanvas);
    sizeCanvas();
    loadSong(0, false);
  </script>
</body>
</html>
